set $launcher_cmd rofi -show drun

# Main app launcher (drun mode)
bindsym $mod+d exec --no-startup-id rofi -show drun

# Power menu (you’ll need a script for this)
bindsym $mod+BackSpace exec ~/.local/bin/power-menu

# Window switcher (rofi window mode)
bindsym $mod+Tab exec --no-startup-id rofi -show window

# Calc
bindsym $mod+C exec --no-startup-id rofi -show calc

# SSH mode (if enabled in rofi config)
#bindsym $mod+s exec --no-startup-id rofi -show ssh
