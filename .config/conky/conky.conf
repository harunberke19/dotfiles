conky.config = {
    -- Window settings for i3
    own_window = true,
    own_window_type = 'override', -- Ensures i3 doesn't try to tile it
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    -- Placement (Top Right, leaving room for the Polybar)
    alignment = 'top_right',
    gap_x = 50,
    gap_y = 80,
    minimum_width = 320,
    maximum_width = 320,

    -- Graphics settings
    draw_shades = true,
    default_shade_color = '#000000',
    draw_outline = false,
    draw_borders = false,
    
    -- Text settings
    use_xft = true,
    font = 'UnifrakturMaguntia:size=16',
    xftalpha = 1.0,
    uppercase = false,
    
    -- Gothic Palette
    default_color = '#c5bda0', -- Bone white
    color1 = '#800000',        -- Blood red (Headers/Bars)
    color2 = '#8b753a',        -- Brass (Labels)
    color3 = '#5c0a0a',        -- Dark red (Dividers)
    
    -- System settings
    update_interval = 2.0,
    double_buffer = true,
    no_buffers = true,
}

conky.text = [[
${color1}${font UnifrakturMaguntia:size=28}System Chronicle${font}${color}
${color3}${hr 2}${color}

${color2}Host:${color} ${alignr}${nodename}
${color2}Uptime:${color} ${alignr}${uptime}
${color2}Kernel:${color} ${alignr}${kernel}

${color1}${font UnifrakturMaguntia:size=22}Vitality${font}${color}
${color3}${hr 2}${color}

${color2}Processor:${color} ${alignr}${cpu cpu0}%
${color1}${cpubar 8,320}${color}

${color2}Memory:${color} ${alignr}${mem} / ${memmax}
${color1}${membar 8,320}${color}

${color2}Root Archive:${color} ${alignr}${fs_used /} / ${fs_size /}
${color1}${fs_bar 8,320 /}${color}
]]
