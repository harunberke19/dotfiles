conky.config = {
    own_window = true,
    own_window_type = 'override',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    -- Centering rules
    alignment = 'middle_middle',
    gap_x = 0,
    gap_y = -50, -- Adjust this slightly if you want it higher or lower
    minimum_width = 800,
    maximum_width = 800,

    draw_shades = true,
    default_shade_color = '#000000',
    
    use_xft = true,
    font = 'UnifrakturMaguntia:size=16',
    xftalpha = 1.0,
    
    -- Gothic Palette
    default_color = '#c5bda0', 
    color1 = '#800000',        
    color2 = '#8b753a',        
    color3 = '#5c0a0a',        
    
    update_interval = 1.0,
    double_buffer = true,
}

conky.text = [[
${alignc}${color2}${font UnifrakturMaguntia:size=120}${time %H:%M}${font}${color}
${voffset 10}
${alignc}${color1}${font UnifrakturMaguntia:size=30}${time %A, %d %B %Y}${font}${color}
${voffset 30}
${alignc}${color3}~ ============ ~ ============ ~${color}
${voffset 20}
${alignc}${color2}   //   |   \\   ${color}
${alignc}${color2} -(((-- O --)))- ${color}
${alignc}${color2}   \\   |   //   ${color}
${alignc}${color2}        |        ${color}
]]
