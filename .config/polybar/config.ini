[colors]
# Atmospheric Gothic Palette
background = #ba0d0d0d
foreground = #c5bda0       ; Aged parchment / bone white
accent_red = #800000       ; Deep blood red
dark_red   = #5c0a0a       ; Dried blood
brass      = #8b753a       ; Antique brass/gold for battery
good_green = #3b4d36       ; Muted, earthy green

[bar/main]
monitor = ${env:MONITOR:}

[bar/main]
# Subtracts exactly 40 pixels from 100% width, 
# leaving exactly 20 pixels for the left and right offsets.
width = 100%
offset-x = %4
offset-y = %4
height = 18pt
# --- Rounded Edges ---

radius = 10

background = ${colors.background}
foreground = ${colors.foreground}

# --- Gothic Framing ---
# Replaced the bottom-only line with a full border
border-size = 3
border-color = ${colors.accent_red}

# --- FONTS ---
font-0 = "FiraCode Nerd Font:size=10:weight=bold;3"
font-1 = "Symbols Nerd Font Mono:size=12;3"
font-2 = "UnifrakturMaguntia:size=14;4"

modules-left = i3
modules-center = date
modules-right = wlan pulseaudio battery 
cursor-click = pointer

# Ensure the bar doesn't draw a background behind the rounded corners
# (Requires a compositor like picom)
override-redirect = false

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false

# Workspace styling with subtle underlines instead of heavy backgrounds
label-focused = %{T3}[ %name% ]%{T-}
label-focused-foreground = ${colors.foreground}
label-focused-underline = ${colors.accent_red}
label-focused-padding = 1

label-unfocused = %{T3}%name%%{T-}
label-unfocused-foreground = #4a4a4a
label-unfocused-padding = 2

label-urgent = %{T3}%name%%{T-}
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.dark_red}
label-urgent-padding = 2

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5

# Left click (A1) now launches the NetworkManager GUI
format-connected = "⟨ %{A1:nm-connection-editor:} %{T3}network: %{T-} <label-connected> %{A} ⟩    "
label-connected = %essid% %{T3}%{F#8b753a}❖%{F-}%signal%%%{T-}  

format-disconnected = "%{A1:nm-connection-editor:} %{T3}network: %{F#5c0a0a}𝔇𝔬𝔴𝔫%{F-}%{T-} %{A}"

[module/pulseaudio]
type = internal/pulseaudio

format-volume =" ⟨ %{T3}volume: <label-volume> %{T-} ⟩ "
label-volume = %percentage%%

format-muted = " ⟨ %{T3}volume: %{F#5c0a0a}muted%{F-} %{T-} ⟩ "

[module/battery]
type = internal/battery
full-at = 99
low-at = 20
battery = BAT0
adapter = ADP1
poll-interval = 5
time-format = %H:%M

format-charging = <label-charging>
label-charging = " %{F#8b753a}⚡%{F-} %{T3}ℭ𝔥𝔞𝔯𝔤𝔦𝔫𝔤%{T-} %percentage%% (%time%) "

format-discharging = <label-discharging>
label-discharging = " %{F#8b753a}🔋%{F-} %{T3}𝔅𝔞𝔱𝔱𝔢𝔯𝔶%{T-} %percentage%% (%time%) "

format-full = <label-full>
label-full = " %{F#3b4d36}☻%{F-} %{T3}𝔉𝔲𝔩𝔩%{T-} %percentage%% "

format-low = <label-low>
label-low = " %{F#800000}⚠%{F-} %{T3}𝔇𝔢𝔭𝔩𝔢𝔱𝔢𝔡%{T-} %percentage%% "

[module/date]
type = internal/date
interval = 5

# Red minimal date/time with gothic font styling
date = %H:%M
date-alt = %d . %m . %Y
label = " %{T3}%date%%{T-} "
label-foreground = ${colors.accent_red}
label-underline = ${colors.accent_red}
