# ~/.config/picom/picom.conf

# --- Backend Rendering ---
# GLX backend is faster and eliminates screen tearing on modern GPUs
backend = "glx";
vsync = true;

# --- Subtle Shadows ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.40;
shadow-offset-x = -12;
shadow-offset-y = -12;

# Exclude your i3bar/polybar from casting awkward shadows onto windows
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Polybar'",
    "class_g = 'i3bar'",
    "class_g = 'conky'",
    "_GTK_FRAME_EXTENTS@:c"
];

# --- Fading Animations ---
# Very quick, subtle fade when switching workspaces or opening apps
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 5;

# --- Transparency Logic ---
# This ensures picom respects the 'alpha' float value defined inside your st binary
detect-client-opacity = true;
